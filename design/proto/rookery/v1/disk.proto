syntax = "proto3";

package rookery.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";

// DiskService manages pre-created thin-LVM disks.
service DiskService {
  rpc ListDisks(ListDisksRequest) returns (ListDisksResponse) {
    option (google.api.http) = {
      get: "/api/disks"
      response_body: "disks"
    };
  }

  rpc GetDisk(GetDiskRequest) returns (Disk) {
    option (google.api.http) = {get: "/api/disks/{id}"};
  }

  rpc CreateDisk(CreateDiskRequest) returns (Disk) {
    option (google.api.http) = {
      post: "/api/disks"
      body: "*"
    };
  }

  rpc UpdateDisk(UpdateDiskRequest) returns (Disk) {
    option (google.api.http) = {
      put: "/api/disks/{id}"
      body: "*"
    };
  }

  rpc DeleteDisk(DeleteDiskRequest) returns (DeleteDiskResponse) {
    option (google.api.http) = {delete: "/api/disks/{id}"};
  }
}

message VMDisk {
  int64 id = 1;
  string name = 2;
  int32 size_gb = 3;
  optional int64 storage_backend_id = 4;
  string storage_backend_name = 5;
  string vg = 6;
  string thin_pool = 7;
  string device = 8;
  // source is the backend driver ("lvm-thin", "host-device", "kouja", ...).
  string source = 9;
  // size_bytes is the exact host device size for passthrough disks.
  uint64 size_bytes = 10;
  // locator is a display-only description of a remote attachment.
  string locator = 11;
  // protocol distinguishes local, iscsi, nvme-tcp, and rbd attachments.
  string protocol = 12;
  reserved 13, 14;
  reserved "read_bps", "write_bps";
  int64 throttle_class_id = 15;
  string throttle_class_name = 16;
}

message Disk {
  int64 id = 1;
  string name = 2;
  int32 size_gb = 3;
  optional int64 storage_backend_id = 4;
  string storage_backend_name = 5;
  string vg = 6;
  string thin_pool = 7;
  string device = 8;
  optional string attached_vm_id = 9;
  string attached_vm_name = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  bool is_template = 13;
  optional int64 template_disk_id = 14;
  string template_disk_name = 15;
  string provisioning_script = 16;
  string provisioning_timeout = 17;
  // source is the backend driver ("lvm-thin", "host-device", "kouja", ...).
  string source = 18;
  // size_bytes is the exact host device size for passthrough disks.
  uint64 size_bytes = 19;
  // locator is a display-only description of a remote attachment.
  string locator = 20;
  // deletion_state is empty for a ready disk, or provisioning/deleting/delete_failed.
  string deletion_state = 21;
  // deletion_error is the last asynchronous deletion error.
  string deletion_error = 22;
  // protocol distinguishes local, iscsi, nvme-tcp, and rbd attachments.
  string protocol = 23;
  reserved 24, 25;
  reserved "read_bps", "write_bps";
  int64 throttle_class_id = 26;
  string throttle_class_name = 27;
  optional string attached_lightvm_id = 28;
  string attached_lightvm_name = 29;
}

message ImportableDisk {
  string name = 1;
  int32 size_gb = 2;
  bool registered = 3;
  optional int64 disk_id = 4;
  optional string attached_vm_id = 5;
  string attached_vm_name = 6;
  string storage_backend_name = 7;
  optional string attached_lightvm_id = 8;
  string attached_lightvm_name = 9;
}

message ListDisksRequest {}

message ListDisksResponse {
  repeated Disk disks = 1;
}

message GetDiskRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}

message CreateDiskRequest {
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 127
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  }];
  optional int32 size_gb = 2 [(validate.rules).int32 = {gte: 1, lte: 65536}];
  optional int64 storage_backend_id = 3 [(validate.rules).int64 = {gt: 0}];
  optional int64 template_disk_id = 4 [(validate.rules).int64 = {gt: 0}];
  optional bool is_template = 5;
  string provisioning_script = 6 [(validate.rules).string = {ignore_empty: true, max_len: 4096}];
  string provisioning_timeout = 7 [(validate.rules).string = {ignore_empty: true, max_len: 32}];
  google.protobuf.Struct provisioning = 8;
  // host_device registers an existing host block device (a whole disk,
  // partition, or logical volume) for passthrough to one VM. When set,
  // storage_backend_id, size_gb, is_template, template_disk_id, and
  // provisioning settings must be omitted; the size is read from the device.
  // throttle_class_id is allowed.
  string host_device = 9 [(validate.rules).string = {ignore_empty: true, max_len: 4096}];
  reserved 10, 11;
  reserved "read_bps", "write_bps";
  int64 throttle_class_id = 12 [(validate.rules).int64 = {gte: 0}];
}

message DeleteDiskResponse {
  bool accepted = 1;
  string state = 2;
}

message UpdateDiskRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
  optional bool is_template = 2;
  optional string provisioning_script = 3 [(validate.rules).string = {max_len: 4096}];
  optional string provisioning_timeout = 4 [(validate.rules).string = {max_len: 32}];
  reserved 5, 6;
  reserved "read_bps", "write_bps";
  optional int64 throttle_class_id = 7 [(validate.rules).int64 = {gte: 0}];
}

message DeleteDiskRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}
