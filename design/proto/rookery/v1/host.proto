syntax = "proto3";

package rookery.v1;

import "google/api/annotations.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";

// HostService exposes Linux host network information used by network functions.
service HostService {
  rpc ListHostInterfaces(ListHostInterfacesRequest) returns (ListHostInterfacesResponse) {
    option (google.api.http) = {
      get: "/api/host/interfaces"
      response_body: "interfaces"
    };
  }
}

message HostInterface {
  string name = 1;
  bool up = 2;
  repeated string addresses = 3;
  bool default_route = 4;
  bool physical = 5;
  bool wireless = 6;
  bool in_vpp = 7;
  bool vpp_checked = 8;
  optional uint32 vpp_sw_if_index = 9;
  string vpp_name = 10;
  bool vpp_up = 11;
  string vpp_type = 12;
}

message ListHostInterfacesRequest {}

message ListHostInterfacesResponse {
  repeated HostInterface interfaces = 1;
}
