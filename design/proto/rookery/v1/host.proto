syntax = "proto3";

package rookery.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";

// HostService exposes Linux host network information used by network functions.
service HostService {
  rpc ListHostInterfaces(ListHostInterfacesRequest) returns (ListHostInterfacesResponse) {
    option (google.api.http) = {
      get: "/api/host/interfaces"
      response_body: "interfaces"
    };
  }

  // AttachHostInterface takes over a host NIC into VPP and persists it so it
  // is recreated after a VPP restart.
  rpc AttachHostInterface(AttachHostInterfaceRequest) returns (HostInterface) {
    option (google.api.http) = {
      post: "/api/host/interfaces/{name}/attach"
      body: "*"
    };
  }

  // DetachHostInterface removes the VPP host-interface; the Linux NIC becomes
  // available to the host again.
  rpc DetachHostInterface(DetachHostInterfaceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/host/interfaces/{name}"};
  }

  // ListHostTaps lists persistent taps that connect a Rookery Network to the
  // Linux host.
  rpc ListHostTaps(ListHostTapsRequest) returns (ListHostTapsResponse) {
    option (google.api.http) = {
      get: "/api/host/taps"
      response_body: "taps"
    };
  }

  // CreateHostTap creates a VPP tap on a network bridge domain and persists it
  // so it is recreated after an API or VPP restart.
  rpc CreateHostTap(CreateHostTapRequest) returns (HostTap) {
    option (google.api.http) = {
      post: "/api/host/taps"
      body: "*"
    };
  }

  // DeleteHostTap removes a persistent network host tap.
  rpc DeleteHostTap(DeleteHostTapRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/host/taps/{id}"};
  }
}

message HostInterface {
  string name = 1;
  bool up = 2;
  repeated string addresses = 3;
  bool default_route = 4;
  bool physical = 5;
  bool wireless = 6;
  bool in_vpp = 7;
  bool vpp_checked = 8;
  optional uint32 vpp_sw_if_index = 9;
  string vpp_name = 10;
  bool vpp_up = 11;
  string vpp_type = 12;
  bool managed = 13;
  repeated string vpp_addresses = 14;
}

message ListHostInterfacesRequest {}

message ListHostInterfacesResponse {
  repeated HostInterface interfaces = 1;
}

message AttachHostInterfaceRequest {
  string name = 1 [(validate.rules).string = {min_len: 1}];
}

message DetachHostInterfaceRequest {
  string name = 1 [(validate.rules).string = {min_len: 1}];
}

// HostTap is a VPP tap that bridges a Rookery Network to the Linux host. The
// host-side interface is named `name`; `ipv4_address` is optional and, when
// set, is assigned to that interface.
message HostTap {
  int64 id = 1;
  int64 network_id = 2;
  string network_name = 3;
  string name = 4;
  uint32 sw_if_index = 5;
  string ipv4_address = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  repeated string vpp_addresses = 9;
}

message ListHostTapsRequest {
  int64 network_id = 1 [(validate.rules).int64 = {ignore_empty: true, gt: 0}];
}

message ListHostTapsResponse {
  repeated HostTap taps = 1;
}

message CreateHostTapRequest {
  int64 network_id = 1 [(validate.rules).int64 = {gt: 0}];
  string name = 2 [(validate.rules).string = {
    ignore_empty: true
    max_len: 15
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  }];
  string ipv4_address = 3 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
}

message DeleteHostTapRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}
