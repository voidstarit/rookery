syntax = "proto3";

package rookery.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";

// NetworkService manages VPP bridge domains presented as Rookery Networks.
service NetworkService {
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse) {
    option (google.api.http) = {
      get: "/api/networks"
      response_body: "networks"
    };
  }

  rpc GetNetwork(GetNetworkRequest) returns (Network) {
    option (google.api.http) = {get: "/api/networks/{id}"};
  }

  rpc CreateNetwork(CreateNetworkRequest) returns (Network) {
    option (google.api.http) = {
      post: "/api/networks"
      body: "*"
    };
  }

  rpc UpdateNetwork(UpdateNetworkRequest) returns (Network) {
    option (google.api.http) = {
      put: "/api/networks/{id}"
      body: "*"
    };
  }

  rpc DeleteNetwork(DeleteNetworkRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/networks/{id}"};
  }

  rpc ListNetworkPipes(ListNetworkPipesRequest) returns (ListNetworkPipesResponse) {
    option (google.api.http) = {
      get: "/api/network-pipes"
      response_body: "pipes"
    };
  }

  rpc CreateNetworkPipe(CreateNetworkPipeRequest) returns (NetworkPipe) {
    option (google.api.http) = {
      post: "/api/network-pipes"
      body: "*"
    };
  }

  rpc DeleteNetworkPipe(DeleteNetworkPipeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/network-pipes/{id}"};
  }
}

message Network {
  int64 id = 1;
  string name = 2;
  uint32 bridge_domain_id = 3;
  int32 interface_count = 4;
  string bvi_host_name = 5;
  uint32 bvi_sw_if_index = 6;
  string ipv4_gateway = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string ipv4_cidr = 10;
  string ipv6_cidr = 11;
  uint32 route_table_id = 12;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated Network networks = 1;
}

message GetNetworkRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}

message CreateNetworkRequest {
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 64
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  }];
  string ipv4_cidr = 2 [(validate.rules).string = {min_len: 1}];
  string ipv6_cidr = 3 [(validate.rules).string = {min_len: 1}];
}

message UpdateNetworkRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
  string ipv4_cidr = 2 [(validate.rules).string = {min_len: 1}];
  string ipv6_cidr = 3 [(validate.rules).string = {min_len: 1}];
}

message DeleteNetworkRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}

message NetworkPipe {
  int64 id = 1;
  int64 network_a_id = 2;
  string network_a_name = 3;
  int64 network_b_id = 4;
  string network_b_name = 5;
  uint32 instance = 6;
  uint32 parent_sw_if_index = 7;
  uint32 endpoint_a_sw_if_index = 8;
  uint32 endpoint_b_sw_if_index = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListNetworkPipesRequest {}

message ListNetworkPipesResponse {
  repeated NetworkPipe pipes = 1;
}

message CreateNetworkPipeRequest {
  int64 network_a_id = 1 [(validate.rules).int64 = {gt: 0}];
  int64 network_b_id = 2 [(validate.rules).int64 = {gt: 0}];
}

message DeleteNetworkPipeRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}
