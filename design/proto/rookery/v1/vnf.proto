syntax = "proto3";

package rookery.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";

// VNFLease is one DHCP lease reported by a running DHCP VNF. It is shared by
// the public DHCP VNF service and the internal DHCP daemon service.
message VNFLease {
  string client_id = 1;
  string address = 2;
  string hostname = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool active = 5;
}
