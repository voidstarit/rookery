syntax = "proto3";

package rookery.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";
import "rookery/v1/interface.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";

// RouteTableService manages VRF/FIB definitions and their interface binding.
service RouteTableService {
  rpc ListRouteTables(ListRouteTablesRequest) returns (ListRouteTablesResponse) {
    option (google.api.http) = {
      get: "/api/route-tables"
      response_body: "route_tables"
    };
  }

  rpc CreateRouteTable(CreateRouteTableRequest) returns (RouteTable) {
    option (google.api.http) = {
      post: "/api/route-tables"
      body: "*"
    };
  }

  rpc DeleteRouteTable(DeleteRouteTableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/route-tables/{id}"};
  }

  rpc SetInterfaceRouteTables(SetInterfaceRouteTablesRequest) returns (VirtualInterface) {
    option (google.api.http) = {
      put: "/api/interfaces/{id}/route-tables"
      body: "*"
    };
  }

  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse) {
    option (google.api.http) = {
      get: "/api/route-tables/{route_table_id}/routes"
      response_body: "routes"
    };
  }

  rpc CreateRoute(CreateRouteRequest) returns (Route) {
    option (google.api.http) = {
      post: "/api/route-tables/{route_table_id}/routes"
      body: "*"
    };
  }

  rpc DeleteRoute(DeleteRouteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/routes/{id}"};
  }

  rpc ListFIBRoutes(ListFIBRoutesRequest) returns (ListFIBRoutesResponse) {
    option (google.api.http) = {
      get: "/api/route-tables/{route_table_id}/fib"
      response_body: "routes"
    };
  }
}

message FIBPath {
  uint32 sw_if_index = 1;
  string interface_name = 2;
  string next_hop = 3;
  string type = 4;
  uint32 weight = 5;
  uint32 preference = 6;
  string proto = 7;
}

message FIBRoute {
  string prefix = 1;
  uint32 table_id = 2;
  bool ipv6 = 3;
  uint32 source = 4;
  string source_name = 5;
  bool dynamic = 6;
  uint32 stats_index = 7;
  repeated FIBPath paths = 8;
}

message ListFIBRoutesRequest {
  int64 route_table_id = 1;
  bool ipv6 = 2;
}

message ListFIBRoutesResponse {
  repeated FIBRoute routes = 1;
}

message Route {
  int64 id = 1;
  int64 route_table_id = 2;
  uint32 table_id = 3;
  bool ipv6 = 4;
  string prefix = 5;
  string next_hop = 6;
  optional int64 interface_id = 7;
  string interface_name = 8;
  string egress_interface = 11;
  uint32 preference = 12;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListRoutesRequest {
  int64 route_table_id = 1;
  bool ipv6 = 2;
}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message CreateRouteRequest {
  int64 route_table_id = 1;
  bool ipv6 = 2;
  string prefix = 3 [(validate.rules).string = {min_len: 1, max_len: 64}];
  string next_hop = 4 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
  optional int64 interface_id = 5 [(validate.rules).int64 = {gt: 0}];
  string egress_interface = 6 [(validate.rules).string = {ignore_empty: true, max_len: 64}];
  uint32 preference = 7;
}

message DeleteRouteRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}

message RouteTable {
  int64 id = 1;
  string name = 2;
  uint32 table_id = 3;
  bool ipv6 = 4;
  bool is_default = 5;
  int64 interface_count = 6;
  int64 route_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int64 network_id = 10;
  bool managed = 11;
}

message ListRouteTablesRequest {}

message ListRouteTablesResponse {
  repeated RouteTable route_tables = 1;
}

message CreateRouteTableRequest {
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 63
    pattern: "^[A-Za-z0-9][A-Za-z0-9._ -]*$"
  }];
  uint32 table_id = 2 [(validate.rules).uint32 = {gte: 1}];
  bool ipv6 = 3;
}

message DeleteRouteTableRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
}

message SetInterfaceRouteTablesRequest {
  int64 id = 1 [(validate.rules).int64 = {gt: 0}];
  uint32 ipv4_table_id = 2;
  uint32 ipv6_table_id = 3;
}
