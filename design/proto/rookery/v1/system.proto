syntax = "proto3";

package rookery.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";
import "rookery/v1/cgroup.proto";

option go_package = "github.com/voidstarit/rookery/design/gen/rookery/v1;rookeryv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Rookery API"
    description: "Virtual-machine, storage, network, and VPP management API."
    version: "1.0"
  }
  schemes: HTTP
};

// SystemService exposes host and readiness information plus server settings.
service SystemService {
  rpc GetHealth(GetHealthRequest) returns (HealthResponse) {
    option (google.api.http) = {get: "/api/healthz"};
  }

  rpc GetStatus(GetStatusRequest) returns (StatusResponse) {
    option (google.api.http) = {get: "/api/status"};
  }

  rpc GetStartupScript(GetStartupScriptRequest) returns (StartupScript) {
    option (google.api.http) = {get: "/api/startup-script"};
  }

  rpc UpdateStartupScript(UpdateStartupScriptRequest) returns (StartupScript) {
    option (google.api.http) = {
      put: "/api/startup-script"
      body: "*"
    };
  }

  rpc GetVPPStartupScript(GetVPPStartupScriptRequest) returns (StartupScript) {
    option (google.api.http) = {get: "/api/vpp-startup-script"};
  }

  rpc UpdateVPPStartupScript(UpdateVPPStartupScriptRequest) returns (StartupScript) {
    option (google.api.http) = {
      put: "/api/vpp-startup-script"
      body: "*"
    };
  }

  // GetCgroupSettings returns the host-wide cgroup v2 limits and runtime
  // status.
  rpc GetCgroupSettings(GetCgroupSettingsRequest) returns (CgroupSettings) {
    option (google.api.http) = {get: "/api/cgroup-settings"};
  }

  // UpdateCgroupSettings stores and applies host-wide cgroup v2 limits. Every
  // QEMU process runs below the configured parent cgroup.
  rpc UpdateCgroupSettings(UpdateCgroupSettingsRequest) returns (CgroupSettings) {
    option (google.api.http) = {
      put: "/api/cgroup-settings"
      body: "*"
    };
  }
}

message GetHealthRequest {}

message HealthResponse {
  string status = 1;
}

message GetStatusRequest {}

message ComponentStatus {
  bool ready = 1;
  string state = 2;
  string detail = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message ThinPoolStatus {
  bool ready = 1;
  string state = 2;
  string detail = 3;
  google.protobuf.Timestamp checked_at = 4;
  string vg = 5;
  string name = 6;
}

message VPPStatus {
  bool ready = 1;
  string state = 2;
  string detail = 3;
  google.protobuf.Timestamp checked_at = 4;
  string socket = 5;
}

message StatusResponse {
  bool ready = 1;
  google.protobuf.Timestamp checked_at = 2;
  ThinPoolStatus thin_pool = 3;
  VPPStatus vpp = 4;
  StartupScriptStatus rookery_startup_script = 5;
  StartupScriptStatus vpp_startup_script = 6;
}

message StartupScriptStatus {
  bool enabled = 1;
  string status = 2;
  int32 exit_code = 3;
  google.protobuf.Timestamp ran_at = 4;
}

message GetStartupScriptRequest {}

message UpdateStartupScriptRequest {
  bool enabled = 1;
  string script = 2 [(validate.rules).string = {max_len: 65536}];
}

message StartupScript {
  bool enabled = 1;
  string script = 2;
  string status = 3;
  int32 exit_code = 4;
  string output = 5;
  google.protobuf.Timestamp ran_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message GetVPPStartupScriptRequest {}

message UpdateVPPStartupScriptRequest {
  bool enabled = 1;
  string script = 2 [(validate.rules).string = {max_len: 65536}];
}

message GetCgroupSettingsRequest {}

message UpdateCgroupSettingsRequest {
  bool enabled = 1;
  string cpus = 2 [(validate.rules).string = {max_len: 512}];
  string mems = 3 [(validate.rules).string = {max_len: 512}];
  int64 memory_max_bytes = 4 [(validate.rules).int64 = {gte: 0}];
  int32 cpu_weight = 5 [(validate.rules).int32 = {gte: 0, lte: 10000}];
  repeated CgroupIOLimit io_limits = 6 [(validate.rules).repeated = {max_items: 64}];
}
