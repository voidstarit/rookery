name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build linux/amd64 release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build API and VNF daemon
        run: make release VERSION="${GITHUB_REF_NAME}"

      - name: Verify archive contents
        run: |
          tar -tzf "dist/rookery-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          test -f "dist/rookery-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/rookery-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
              "dist/rookery-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/rookery-${GITHUB_REF_NAME}-linux-amd64.tar.gz" \
              "dist/rookery-${GITHUB_REF_NAME}-linux-amd64.tar.gz.sha256" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
