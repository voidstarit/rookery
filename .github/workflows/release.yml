name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build linux/amd64 release
    runs-on: ubuntu-latest
    # A release created by this workflow's own GITHUB_TOKEN does not normally
    # trigger another run, but skip it explicitly if it ever does.
    if: github.event_name != 'release' || github.event.release.author.login != 'github-actions[bot]'
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build API, VNF daemon, and Terraform provider
        run: make release VERSION="${RELEASE_TAG}"

      - name: Verify archive contents
        run: |
          PROVIDER_ASSET="terraform-provider-rookery_${RELEASE_TAG#v}_linux_amd64"
          tar -tzf "dist/rookery-${RELEASE_TAG}-linux-amd64.tar.gz"
          test -f "dist/rookery-${RELEASE_TAG}-linux-amd64.tar.gz.sha256"
          test -x "dist/rookery-${RELEASE_TAG}-linux-amd64/rookery"
          test -x "dist/rookery-${RELEASE_TAG}-linux-amd64/vnfs"
          test -x "dist/rookery-${RELEASE_TAG}-linux-amd64/${PROVIDER_ASSET}"
          test -f "dist/rookery-${RELEASE_TAG}-linux-amd64/docs/imgs/vms.png"
          test -f "dist/rookery-${RELEASE_TAG}-linux-amd64/docs/imgs/icon.png"
          test -f "dist/rookery-${RELEASE_TAG}-linux-amd64/${PROVIDER_ASSET}.sha256"
          (cd "dist/rookery-${RELEASE_TAG}-linux-amd64" && sha256sum -c "${PROVIDER_ASSET}.sha256")
          (cd dist && sha256sum -c "rookery-${RELEASE_TAG}-linux-amd64.tar.gz.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rookery-${{ env.RELEASE_TAG }}-linux-amd64
          path: |
            dist/rookery-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz
            dist/rookery-${{ env.RELEASE_TAG }}-linux-amd64.tar.gz.sha256
            dist/rookery-${{ env.RELEASE_TAG }}-linux-amd64/terraform-provider-rookery_*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROVIDER_ASSET="terraform-provider-rookery_${RELEASE_TAG#v}_linux_amd64"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64.tar.gz" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64.tar.gz.sha256" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64/${PROVIDER_ASSET}" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64/${PROVIDER_ASSET}.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64.tar.gz" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64.tar.gz.sha256" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64/${PROVIDER_ASSET}" \
              "dist/rookery-${RELEASE_TAG}-linux-amd64/${PROVIDER_ASSET}.sha256" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
