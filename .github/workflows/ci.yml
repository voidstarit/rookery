name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go and UI checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: make ui-build

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          {
            echo "### Go test coverage"
            echo ""
            echo "Total statement coverage: **${total}%**"
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" 'BEGIN { if (total < 20) { printf "coverage %.2f%% is below the 20%% floor\n", total; exit 1 } }'

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install protobuf compiler
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          sudo unzip -q /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install protoc plugins
        run: make proto-tools

      - name: Check protobuf output
        run: make proto-check PROTO_INCLUDE=/usr/local/include

      - name: Build UI
        run: make ui-build

      - name: Check generated UI bundle
        run: git diff --exit-code -- internal/webui/static/build
